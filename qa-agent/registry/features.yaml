journeys:
  - id: JRN-SMOKE-HOME-01
    status: partial
    feature_ids: [PUB-01]
    role: guest
    purpose: Confirm public home loads without browser console errors
    prerequisites:
      - Local Laravel at OURNEAR_BASE_URL
      - OURNEAR_ALLOW_RUN=local
    steps:
      - Navigate to /
      - Assert HTTP 200 and document title present
      - Assert no captured console errors
    expected_outcomes:
      - Home page renders for anonymous visitor
    assertions:
      - pytest:tests/smoke/test_public_home.py::test_home_loads
    test_data: []
    risk: P1

  - id: JRN-SMOKE-LOGIN-01
    status: partial
    feature_ids: [ACC-AUTH-01, CAN-01]
    role: candidate
    purpose: QA fixture candidate can log in and reach account dashboard
    prerequisites:
      - qa:hiring-fixtures candidate account
      - OURNEAR_QA_CANDIDATE_* in config/local.env
    steps:
      - Navigate to /login
      - Fill labeled login fields and submit
      - Wait for /account URL and Dashboard heading
    expected_outcomes:
      - Authenticated candidate session on account home
    assertions:
      - pytest:tests/smoke/test_account_login.py::test_candidate_login_reaches_account
    test_data:
      - qa-candidate@example.test (local fixtures)
    risk: P0

  - id: JRN-CANDIDATE-APPLY-01
    status: implemented
    feature_ids: [PUB-03, CAN-04, CAN-07, X-03]
    role: candidate
    purpose: Apply to a published job using library resume; verify application and snapshot integrity
    prerequisites:
      - qa:hiring-fixtures
      - Readable resume in candidate library
      - Unapplied published job slug available
    steps:
      - Login and confirm Dashboard
      - Search /jobs and open eligible fixture job
      - Apply page shows resume ready; submit application
      - Confirm Application submitted with ONT-A-* reference
      - Verify /account/applications persistence after reload
      - Duplicate apply redirects; Applied state on job detail
    expected_outcomes:
      - New application row with stable snapshot separate from library file
    assertions:
      - scripts/qa-provision-journey-apply-job.php then pytest:tests/journey/test_candidate_apply_journey.py::test_jrn_candidate_apply_new_application
      - pytest:tests/journey/test_candidate_apply_journey.py::test_jrn_candidate_apply_duplicate_and_persistence
    test_data:
      - Fixture job slugs from QaHiringFixtures
    risk: P0
    depends_on: [JRN-SMOKE-LOGIN-01]
    phpunit: [ApplicationExperienceTest]

  - id: JRN-EMPLOYER-JOB-PUBLISH-01
    status: implemented
    feature_ids: [EMP-01, EMP-02, PUB-02, PUB-03, X-03]
    role: employer
    purpose: Employer job draft, validation, publish, public visibility, edit, close, and cross-role denial
    prerequisites:
      - php artisan qa:hiring-fixtures
      - QA employer A/B and candidate credentials in config/local.env
      - Local Laravel at OURNEAR_BASE_URL
    steps:
      - Employer A hiring dashboard and job management
      - Create draft with validation; reopen persisted draft
      - Publish; public list/detail; pause; hidden from public; republish (reactivation)
      - Edit published job; close job; confirm not public
      - Employer B and candidate denied employer job management URLs
    expected_outcomes:
      - Lifecycle matches employer UI (draft, publish, pause, republish, close)
      - Public jobs only while published and active; authorization enforced
    assertions:
      - pytest:tests/journey/test_employer_job_publish_journey.py::test_jrn_employer_job_publish_lifecycle
      - pytest:tests/journey/test_employer_job_publish_journey.py::test_jrn_employer_job_publish_authorization
      - pytest:tests/test_employer_job_publish_unit.py
      - phpunit:EmployerAccountWorkspaceTest
    test_data:
      - scripts/inspect-qa-employer-job-form-defaults.php
      - QaHiringFixtures SLUG_PUBLISHED_A for isolation
    risk: P0
    depends_on: [JRN-SMOKE-LOGIN-01]
    phpunit: [EmployerAccountWorkspaceTest, PolicyFoundationTest]

  - id: JRN-EMPLOYER-RESUME-01
    status: implemented
    feature_ids: [EMP-03, EMP-09, X-03]
    role: employer
    purpose: Owning employer views applicant resume; non-owner receives forbidden
    prerequisites:
      - Existing application with snapshot from apply journey
      - qa-employer-a and qa-employer-b accounts
    steps:
      - Employer A opens application detail inline resume
      - Employer B attempts same application resume URL
    expected_outcomes:
      - Employer A sees readable resume; Employer B blocked
    assertions:
      - pytest:tests/journey/test_employer_resume_journey.py::test_jrn_employer_resume_owner_workflow
      - pytest:tests/journey/test_employer_resume_journey.py::test_jrn_employer_resume_employer_b_isolation
      - phpunit:EmployerHiringStage25Test
    test_data:
      - ONT-A-* application numbers from fixtures
    risk: P0
    depends_on: [JRN-CANDIDATE-APPLY-01]
    phpunit: [EmployerHiringStage25Test, PolicyFoundationTest]

  - id: JRN-ADMIN-APPLICATION-01
    status: implemented
    feature_ids: [ADM-03]
    role: admin
    purpose: Admin reviews QA application, resume snapshot, and supported status update
    prerequisites:
      - QA application from candidate apply journey with resume snapshot
      - Local admin account (OURNEAR_QA_ADMIN_*)
    steps:
      - Admin login and operations dashboard
      - Open /admin/applications for QA ONT-A-* record
      - View/download readable resume; optional New to Reviewing status when still New
    expected_outcomes:
      - Admin can manage permitted application workspace; account roles cannot access admin routes
    assertions:
      - pytest:tests/journey/test_admin_application_journey.py::test_jrn_admin_application_review_workflow
      - pytest:tests/journey/test_admin_application_journey.py::test_jrn_admin_application_account_role_isolation
      - pytest:tests/journey/test_admin_application_journey.py::test_jrn_admin_application_employer_role_isolation
      - phpunit:ApplicationsWorkspaceTest
    test_data:
      - scripts/inspect-qa-employer-journey-target.php
    risk: P0
    depends_on: [JRN-CANDIDATE-APPLY-01]
    phpunit: [ApplicationsWorkspaceTest]

  - id: JRN-CROSS-ROLE-01
    status: implemented
    feature_ids: [PUB-03, CAN-07, EMP-03, EMP-09, ADM-03, X-03]
    role: cross-role
    purpose: One QA application flows candidate apply, employer A review, admin workspace
    prerequisites:
      - scripts/qa-provision-journey-apply-job.php eligible slug
      - ournear-qa preflight-journey (apply budget + provision slots)
      - QA credentials for candidate, employer A/B, admin
    steps:
      - Candidate apply → ONT-A-*; candidate applications list persistence
      - Employer A applicants, detail, readable resume, hiring applications list
      - Admin drawer, resume, New→Reviewing when applicable, reload persistence
      - Employer B isolation; candidate and employer A denied admin routes
    expected_outcomes:
      - Same business_id across permitted roles; admin-only routes denied for account roles
    assertions:
      - pytest:tests/journey/test_cross_role_e2e.py::test_jrn_cross_role_application_e2e
    test_data:
      - scripts/inspect-qa-application-by-business-id.php
    risk: P0
    depends_on: [JRN-CANDIDATE-APPLY-01, JRN-EMPLOYER-RESUME-01, JRN-ADMIN-APPLICATION-01]
    phpunit: [ApplicationsWorkspaceTest, EmployerHiringStage25Test]

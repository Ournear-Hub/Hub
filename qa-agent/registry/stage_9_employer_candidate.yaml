  - id: STG9-EMP-ACT-001
    feature_ids: [EMP-03]
    route: /account/jobs/{slug}/applications/{id}
    summary: Employer interview schedule or pipeline actions
  - id: STG9-INT-ADM-001
    feature_ids: [ADM-03]
    route: /admin/applications
    summary: Admin schedules or verifies interview on Interview tab
  - id: STG9-INT-ADM-002
    feature_ids: [ADM-03]
    route: /admin/applications
    summary: Interview row persists after reload
  - id: STG9-INT-EMP-001
    feature_ids: [EMP-03]
    route: /account/jobs/{slug}/applications/{id}

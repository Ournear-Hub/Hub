    summary: Interview status consistent employer and candidate
  - id: STG9-AUTH-001
    feature_ids: [EMP-09]
    route: /account/hiring/applications
    summary: Employer B isolation
  - id: STG9-AUTH-002
    feature_ids: [X-03]

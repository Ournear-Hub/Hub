name: Temporary Dependency Security Remediation

on:
  push:
    branches:
      - fix/ci-inertia-pages-security
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  update-vulnerable-composer-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-inertia-pages-security
          persist-credentials: true
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Update affected packages within declared constraints
        run: composer update laravel/framework league/commonmark symfony/http-foundation symfony/yaml --with-all-dependencies --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Verify Composer security audit
        run: composer audit --no-interaction
      - name: Commit resolved dependency lockfile
        shell: bash
        run: |
          if git diff --quiet -- composer.lock; then
            echo "No composer.lock changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Fix vulnerable Composer dependency versions"
          git push origin HEAD:fix/ci-inertia-pages-security

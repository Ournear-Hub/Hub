name: OurNear Hire - CI

on:
  push:
    branches:
      - main
      - staging
      - staging-baseline-2026-10-07
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ournear-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Laravel and Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  flutter-checks:
    name: Flutter Mobile Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

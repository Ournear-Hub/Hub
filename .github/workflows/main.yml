name: OurNear Hire - CI

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - staging
      - main
      - 'release/**'
  pull_request:
    branches:
      - develop
      - staging
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ournear-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Laravel, PHP and Frontend Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ournear_hire_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ularavel -plaravel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi
        env:
          APP_ENV: testing
          APP_KEY: base64:2fl+KTVYdl/b6BpjgNk4eUUnQ6O4ZbXz3YqK3lQvQ3E=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ournear_hire_test
          DB_USERNAME: laravel
          DB_PASSWORD: laravel
          MAIL_MAILER: array
          MAIL_FROM_ADDRESS: testing@ournear.test
          MAIL_FROM_NAME: "OurNear Hire Test"

      - name: Run Laravel and PHPUnit tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:2fl+KTVYdl/b6BpjgNk4eUUnQ6O4ZbXz3YqK3lQvQ3E=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ournear_hire_test
          DB_USERNAME: laravel
          DB_PASSWORD: laravel
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          MAIL_FROM_ADDRESS: testing@ournear.test
          MAIL_FROM_NAME: "OurNear Hire Test"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: TypeScript checks
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  flutter-checks:
    name: Flutter Mobile Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
